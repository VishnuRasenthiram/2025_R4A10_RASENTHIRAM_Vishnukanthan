<ul class="footer-grid">
  @for (data of dataFooters; track data) {
  <li class="footer-column">
      <h3>{{ data.title }}</h3>
      <ul>
          @for (page of data.listesPages; track page) {
          <li><a [href]="page.href">{{ page.titleLink }}</a></li>
          }
      </ul>
  </li>
  }
</ul>
