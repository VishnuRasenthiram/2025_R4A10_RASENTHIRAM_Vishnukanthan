<article class="client">
  <img class="client-image" [src]="currentReview.imageUrl" [alt]="currentReview.name" />
  <section class = "client-text">
      <h3 class="client-name">{{ currentReview.name }}</h3>
      <p class="client-company">{{ currentReview.company }}</p>
  </section>
  <p class="client-description">{{ currentReview.description }}</p>
</article>
